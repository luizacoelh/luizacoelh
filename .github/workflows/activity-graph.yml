name: Update activity graph

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/activity_graph.py'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/activity_graph.py
      - name: Save updated graph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo 'Graph already up to date'
          else
            git commit -m 'Update contribution graph [skip ci]'
            git push
          fi
